version: "3.8"

services:
  churn-api:
    build: .
    container_name: churn-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/src/mlflow.db
    volumes:
      - ./src/mlflow.db:/app/src/mlflow.db
      - ./src/mlruns:/app/src/mlruns
    restart: unless-stopped