<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecom Churn Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8">
    <div class="max-w-4xl mx-auto px-4">
        <div class="bg-white rounded-2xl shadow-lg p-6 md:p-10">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Telecom Customer Churn Predictor</h1>
            <p class="text-gray-500 mb-8">Enter customer details to predict churn probability.</p>

            <form id="churnForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Personal Info -->
                    <div class="space-y-4">
                        <h3 class="text-lg font-semibold text-gray-700 border-b pb-2">Personal Info</h3>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                            <div class="flex gap-4">
                                <label class="flex items-center"><input type="radio" name="gender" value="Female" checked class="mr-2"> Female</label>
                                <label class="flex items-center"><input type="radio" name="gender" value="Male" class="mr-2"> Male</label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Senior Citizen</label>
                            <div class="flex gap-4">
                                <label class="flex items-center"><input type="radio" name="SeniorCitizen" value="0" checked class="mr-2"> No</label>
                                <label class="flex items-center"><input type="radio" name="SeniorCitizen" value="1" class="mr-2"> Yes</label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Partner</label>
                            <div class="flex gap-4">
                                <label class="flex items-center"><input type="radio" name="Partner" value="No" checked class="mr-2"> No</label>
                                <label class="flex items-center"><input type="radio" name="Partner" value="Yes" class="mr-2"> Yes</label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Dependents</label>
                            <div class="flex gap-4">
                                <label class="flex items-center"><input type="radio" name="Dependents" value="No" checked class="mr-2"> No</label>
                                <label class="flex items-center"><input type="radio" name="Dependents" value="Yes" class="mr-2"> Yes</label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tenure (months)</label>
                            <input type="number" name="tenure" value="1" min="0" max="100" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <!-- Services -->
                    <div class="space-y-4">
                        <h3 class="text-lg font-semibold text-gray-700 border-b pb-2">Services</h3>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Phone Service</label>
                            <div class="flex gap-4">
                                <label class="flex items-center"><input type="radio" name="PhoneService" value="No" checked class="mr-2"> No</label>
                                <label class="flex items-center"><input type="radio" name="PhoneService" value="Yes" class="mr-2"> Yes</label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Multiple Lines</label>
                            <select name="MultipleLines" class="w-full border rounded-lg px-3 py-2">
                                <option value="No phone service" selected>No phone service</option>
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Internet Service</label>
                            <select name="InternetService" class="w-full border rounded-lg px-3 py-2">
                                <option value="DSL" selected>DSL</option>
                                <option value="Fiber optic">Fiber optic</option>
                                <option value="No">No</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Online Security</label>
                            <select name="OnlineSecurity" class="w-full border rounded-lg px-3 py-2">
                                <option value="No" selected>No</option>
                                <option value="Yes">Yes</option>
                                <option value="No internet service">No internet service</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Online Backup</label>
                            <select name="OnlineBackup" class="w-full border rounded-lg px-3 py-2">
                                <option value="No" selected>No</option>
                                <option value="Yes">Yes</option>
                                <option value="No internet service">No internet service</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <h3 class="text-lg font-semibold text-gray-700 border-b pb-2">Protection & Support</h3>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Device Protection</label>
                            <select name="DeviceProtection" class="w-full border rounded-lg px-3 py-2">
                                <option value="No" selected>No</option>
                                <option value="Yes">Yes</option>
                                <option value="No internet service">No internet service</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Tech Support</label>
                            <select name="TechSupport" class="w-full border rounded-lg px-3 py-2">
                                <option value="No" selected>No</option>
                                <option value="Yes">Yes</option>
                                <option value="No internet service">No internet service</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Streaming TV</label>
                            <select name="StreamingTV" class="w-full border rounded-lg px-3 py-2">
                                <option value="No" selected>No</option>
                                <option value="Yes">Yes</option>
                                <option value="No internet service">No internet service</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Streaming Movies</label>
                            <select name="StreamingMovies" class="w-full border rounded-lg px-3 py-2">
                                <option value="No" selected>No</option>
                                <option value="Yes">Yes</option>
                                <option value="No internet service">No internet service</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-lg font-semibold text-gray-700 border-b pb-2">Billing</h3>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Contract</label>
                            <select name="Contract" class="w-full border rounded-lg px-3 py-2">
                                <option value="Month-to-month" selected>Month-to-month</option>
                                <option value="One year">One year</option>
                                <option value="Two year">Two year</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Paperless Billing</label>
                            <div class="flex gap-4">
                                <label class="flex items-center"><input type="radio" name="PaperlessBilling" value="No" checked class="mr-2"> No</label>
                                <label class="flex items-center"><input type="radio" name="PaperlessBilling" value="Yes" class="mr-2"> Yes</label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Payment Method</label>
                            <select name="PaymentMethod" class="w-full border rounded-lg px-3 py-2">
                                <option value="Electronic check" selected>Electronic check</option>
                                <option value="Mailed check">Mailed check</option>
                                <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                                <option value="Credit card (automatic)">Credit card (automatic)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Monthly Charges ($)</label>
                            <input type="number" name="MonthlyCharges" value="29.85" step="0.01" class="w-full border rounded-lg px-3 py-2">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Total Charges ($)</label>
                            <input type="text" name="TotalCharges" value="29.85" class="w-full border rounded-lg px-3 py-2">
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                        Predict Churn
                    </button>
                </div>
            </form>

            <!-- Result Card -->
            <div id="result" class="hidden mt-8 p-6 rounded-xl border-2">
                <h3 class="text-xl font-bold mb-2">Prediction Result</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-sm text-gray-500">Churn Probability</p>
                        <p id="probValue" class="text-2xl font-bold">-</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500">Prediction</p>
                        <p id="predValue" class="text-2xl font-bold">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
