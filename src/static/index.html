<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecom churn predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="shell">
        <header class="head">
            <h1>Telecom churn predictor</h1>
            <p>Enter a customer profile to estimate how likely they are to leave.</p>
        </header>

        <div class="layout">
            <form id="churnForm" class="form" novalidate>
                <div id="groups"></div>
                <div class="actions">
                    <button type="submit" id="submitBtn" class="primary">Predict churn</button>
                    <button type="reset" class="ghost">Reset</button>
                </div>
            </form>

            <aside class="panel" id="panel" data-state="empty" data-tone="" aria-live="polite" aria-busy="false">
                <h2>Churn risk</h2>
                <div class="dial">
                    <svg viewBox="0 0 200 108" role="img" aria-label="Churn probability dial">
                        <path class="track" d="M20 100 A80 80 0 0 1 180 100" pathLength="100"/>
                        <path class="arc" id="arc" d="M20 100 A80 80 0 0 1 180 100" pathLength="100"/>
                    </svg>
                    <output id="pct" class="pct">&ndash;</output>
                </div>
                <p id="verdict" class="verdict">No prediction yet</p>
                <span id="band" class="band" hidden></span>
                <p id="detail" class="detail">Fill in the customer profile, then run the prediction.</p>
                <p id="error" class="error" role="alert" hidden></p>
            </aside>
        </div>
    </main>

    <script src="/static/app2.js"></script>
</body>
</html>
